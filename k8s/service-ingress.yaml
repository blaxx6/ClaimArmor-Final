apiVersion: v1
kind: Service
metadata:
  name: claimarmor-api
  namespace: claimarmor
  labels:
    app.kubernetes.io/name: claimarmor
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: claimarmor
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claimarmor
  namespace: claimarmor
  labels:
    app.kubernetes.io/name: claimarmor
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claimarmor-ingress
  namespace: claimarmor
  labels:
    app.kubernetes.io/name: claimarmor
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.claimarmor.ai
      secretName: claimarmor-tls
  rules:
    - host: api.claimarmor.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claimarmor-api
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claimarmor-api-hpa
  namespace: claimarmor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claimarmor-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claimarmor-worker-hpa
  namespace: claimarmor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claimarmor-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # Wait 10min before scaling down workers
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: claimarmor-api-pdb
  namespace: claimarmor
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: claimarmor
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: claimarmor-worker-pdb
  namespace: claimarmor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claimarmor
      app.kubernetes.io/component: worker
