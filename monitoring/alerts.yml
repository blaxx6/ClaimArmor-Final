groups:
  - name: claimarmor-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(claimarmor_http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate"
          description: "ClaimArmor API is returning >10% 5xx errors for 5 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(claimarmor_http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency"
          description: "P95 latency is above 5 seconds for 5 minutes"

      - alert: InvestigationSLABreach
        expr: histogram_quantile(0.95, rate(claimarmor_http_request_duration_seconds_bucket{path=~"/api/.*/investigate"}[5m])) > 30
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Investigation SLA breach"
          description: "P95 investigation latency exceeds 30s SLA"

      - alert: ServiceDown
        expr: up{job="claimarmor-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ClaimArmor API is down"
          description: "The ClaimArmor API has been unreachable for 1 minute"
