apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "claimarmor.fullname" . }}-config
  labels:
    {{- include "claimarmor.labels" . | nindent 4 }}
data:
  CLAIMARMOR_ENVIRONMENT: {{ .Values.config.environment | quote }}
  CLAIMARMOR_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  CLAIMARMOR_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CLAIMARMOR_LLM_MODE: {{ .Values.config.llmMode | quote }}
  CLAIMARMOR_DB_POOL_SIZE: {{ .Values.config.dbPoolSize | quote }}
  CLAIMARMOR_DB_MAX_OVERFLOW: {{ .Values.config.dbMaxOverflow | quote }}
  CLAIMARMOR_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  CLAIMARMOR_RATE_LIMIT_REQUESTS_PER_MINUTE: {{ .Values.config.rateLimitRequestsPerMinute | quote }}
  CLAIMARMOR_RATE_LIMIT_LOGIN_PER_MINUTE: {{ .Values.config.rateLimitLoginPerMinute | quote }}
  CLAIMARMOR_PROMETHEUS_ENABLED: {{ .Values.config.prometheusEnabled | quote }}
  CLAIMARMOR_DRIFT_PSI_THRESHOLD: {{ .Values.config.driftPsiThreshold | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claimarmor.fullname" . }}-secrets
  labels:
    {{- include "claimarmor.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLAIMARMOR_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  CLAIMARMOR_AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
  CLAIMARMOR_REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  CLAIMARMOR_CELERY_BROKER_URL: {{ .Values.secrets.celeryBrokerUrl | quote }}
  {{- if .Values.secrets.geminiApiKey }}
  CLAIMARMOR_GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  CLAIMARMOR_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
