name: CD — Deploy to Production (Canary)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (e.g., git sha)"
        required: true
        type: string
        default: "latest"
      canary_weight:
        description: "Canary traffic percentage (0-100)"
        required: false
        default: "10"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # If triggered by tag, use the tag name, otherwise use the provided input or git sha
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.ref_name || github.sha }}

jobs:
  canary-deploy:
    name: Canary Deployment (Kind Cluster)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image into Kind
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -n chart-testing

      - name: Deploy canary ({{ inputs.canary_weight }}% traffic)
        run: |
          # Setup base infrastructure on Kind
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl create secret generic claimarmor-secrets -n claimarmor --from-literal=CLAIMARMOR_AUTH_SECRET=demo-secret
          kubectl apply -f k8s/deployments.yaml
          kubectl apply -f k8s/service-ingress.yaml
          
          # Initialize baseline deployment so canary has something to route against
          kubectl set image deployment/claimarmor-api \
            claimarmor=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -n claimarmor
          kubectl rollout status deployment/claimarmor-api -n claimarmor --timeout=300s

          # Create canary deployment (duplicating standard deployment logic for POC)
          kubectl get deployment claimarmor-api -n claimarmor -o yaml | \
            sed 's/name: claimarmor-api/name: claimarmor-api-canary/' | \
            kubectl apply -f -
            
          # Update canary deployment
          kubectl set image deployment/claimarmor-api-canary \
            claimarmor=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -n claimarmor

          # Set canary traffic weight
          kubectl annotate ingress claimarmor-ingress \
            nginx.ingress.kubernetes.io/canary="true" \
            nginx.ingress.kubernetes.io/canary-weight="${{ github.event.inputs.canary_weight || '10' }}" \
            -n claimarmor --overwrite

          kubectl rollout status deployment/claimarmor-api-canary \
            -n claimarmor --timeout=300s

      - name: Port-forward for Smoke test
        run: |
          kubectl port-forward svc/claimarmor-api 8000:80 -n claimarmor &
          sleep 5

      - name: Smoke test canary
        run: |
          for i in $(seq 1 5); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/api/health")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Canary healthy (attempt $i)"
            else
              echo "❌ Canary returned HTTP $HTTP_CODE"
              exit 1
            fi
            sleep 5
          done

      - name: Wait for monitoring validation
        run: |
          echo "⏳ Waiting 30 seconds for error rate validation (accelerated for POC)..."
          sleep 30

  promote:
    name: Promote to Full Production
    runs-on: ubuntu-latest
    needs: canary-deploy
    environment: production-promote
    steps:
      - uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image into Kind
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -n chart-testing

      - name: Promote to production
        run: |
          # Re-apply base since this is a new runner job
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl create secret generic claimarmor-secrets -n claimarmor --from-literal=CLAIMARMOR_AUTH_SECRET=demo-secret
          kubectl apply -f k8s/deployments.yaml
          kubectl apply -f k8s/service-ingress.yaml
          
          # Update main deployment
          kubectl set image deployment/claimarmor-api \
            claimarmor=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -n claimarmor

          kubectl set image deployment/claimarmor-worker \
            worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -n claimarmor

          # Remove canary routing
          kubectl annotate ingress claimarmor-ingress \
            nginx.ingress.kubernetes.io/canary- \
            nginx.ingress.kubernetes.io/canary-weight- \
            -n claimarmor --overwrite

          # Wait for rollout
          kubectl rollout status deployment/claimarmor-api \
            -n claimarmor --timeout=300s
          kubectl rollout status deployment/claimarmor-worker \
            -n claimarmor --timeout=300s

      - name: Port-forward for Final check
        run: |
          kubectl port-forward svc/claimarmor-api 8000:80 -n claimarmor &
          sleep 5

      - name: Final health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf "http://localhost:8000/api/health" | grep -q "healthy"; then
              echo "✅ Production is healthy"
              exit 0
            fi
            echo "Waiting for production... attempt $i"
            sleep 10
          done
          echo "❌ Production health check failed"
          exit 1
