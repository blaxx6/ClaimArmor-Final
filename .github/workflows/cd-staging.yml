name: CD — Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=staging
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Kind Cluster)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image into Kind
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n chart-testing

      - name: Deploy to Kind
        run: |
          # Apply namespace
          kubectl apply -f k8s/namespace.yaml
          
          # Create mock secret for ghcr.io pull if needed
          # In this demo, we assume the repository and its packages are public.
          
          # Apply configmap and empty secrets
          kubectl apply -f k8s/configmap.yaml
          kubectl create secret generic claimarmor-secrets -n claimarmor --from-literal=CLAIMARMOR_AUTH_SECRET=demo-secret
          
          # Apply deployments
          kubectl apply -f k8s/deployments.yaml
          
          # Apply service
          kubectl apply -f k8s/service-ingress.yaml

          # Update images
          kubectl set image deployment/claimarmor-api \
            claimarmor=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n claimarmor

          kubectl set image deployment/claimarmor-worker \
            worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n claimarmor
            
          kubectl set image deployment/claimarmor-beat \
            beat=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n claimarmor

          kubectl rollout status deployment/claimarmor-api \
            -n claimarmor --timeout=300s

      - name: Port-forward for Smoke test
        run: |
          kubectl port-forward svc/claimarmor-api 8000:80 -n claimarmor &
          sleep 5

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf "http://localhost:8000/api/health" | grep -q "healthy"; then
              echo "✅ Staging is healthy"
              exit 0
            fi
            echo "Waiting for staging... attempt $i"
            sleep 10
          done
          echo "❌ Staging health check failed"
          exit 1
