[lint]
ignore = [
    "E501",   # Line too long
    "B008",   # FastAPI Depends() in defaults
    "S101",   # Use of assert (needed in tests)
    "S105",   # Possible hardcoded password
    "S106",
    "S107",
    "S311",   # Random number generator
    "B904",   # Raise from
    "BLE001", # Blind except
    "S110",   # Try-except-pass
    "F841",   # Unused local variables
]
