# ClaimArmor AI — Production Docker Compose
# All services needed for local development + staging

services:
  # ── Database ──────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: claimarmor
      POSTGRES_USER: claimarmor
      POSTGRES_PASSWORD: claimarmor-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimarmor"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ── Redis (Celery broker + cache) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  # ── API Server ────────────────────────────────────────────────────
  claimarmor:
    image: claimarmor-app:local
    build:
      context: .
      args:
        APP_VERSION: "1.0.0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CLAIMARMOR_DATABASE_URL: postgresql+psycopg://claimarmor:claimarmor-demo@postgres:5432/claimarmor
      CLAIMARMOR_REDIS_URL: redis://redis:6379/0
      CLAIMARMOR_AUTH_SECRET: ${CLAIMARMOR_AUTH_SECRET:-replace-this-in-real-deployment}
      CLAIMARMOR_LLM_MODE: ${CLAIMARMOR_LLM_MODE:-offline}
      CLAIMARMOR_ENVIRONMENT: ${CLAIMARMOR_ENVIRONMENT:-development}
      CLAIMARMOR_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Celery Worker (high priority) ─────────────────────────────────
  worker:
    image: claimarmor-app:local
    build:
      context: .
      args:
        APP_VERSION: "1.0.0"
    command: >
      python -m celery -A app.worker worker
      -E
      --loglevel=info
      --queues=claimarmor,claimarmor.high
      --concurrency=4
      --max-tasks-per-child=500
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CLAIMARMOR_ENVIRONMENT: ${CLAIMARMOR_ENVIRONMENT:-development}
      CLAIMARMOR_DATABASE_URL: postgresql+psycopg://claimarmor:claimarmor-demo@postgres:5432/claimarmor
      CLAIMARMOR_REDIS_URL: redis://redis:6379/0
      CLAIMARMOR_CELERY_BROKER_URL: redis://redis:6379/0
      CLAIMARMOR_AUTH_SECRET: ${CLAIMARMOR_AUTH_SECRET:-replace-this-in-real-deployment}
      CLAIMARMOR_LLM_MODE: ${CLAIMARMOR_LLM_MODE:-offline}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    restart: unless-stopped

  # ── Celery Worker (bulk processing) ───────────────────────────────
  worker-bulk:
    image: claimarmor-app:local
    build:
      context: .
      args:
        APP_VERSION: "1.0.0"
    command: >
      python -m celery -A app.worker worker
      -E
      --loglevel=info
      --queues=claimarmor.bulk
      --concurrency=2
      --max-tasks-per-child=200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CLAIMARMOR_ENVIRONMENT: ${CLAIMARMOR_ENVIRONMENT:-development}
      CLAIMARMOR_DATABASE_URL: postgresql+psycopg://claimarmor:claimarmor-demo@postgres:5432/claimarmor
      CLAIMARMOR_REDIS_URL: redis://redis:6379/0
      CLAIMARMOR_CELERY_BROKER_URL: redis://redis:6379/0
      CLAIMARMOR_AUTH_SECRET: ${CLAIMARMOR_AUTH_SECRET:-replace-this-in-real-deployment}
      CLAIMARMOR_LLM_MODE: ${CLAIMARMOR_LLM_MODE:-offline}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    restart: unless-stopped

  # ── Celery Beat (periodic tasks) ──────────────────────────────────
  beat:
    image: claimarmor-app:local
    build:
      context: .
      args:
        APP_VERSION: "1.0.0"
    command: >
      python -m celery -A app.worker beat
      --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CLAIMARMOR_ENVIRONMENT: ${CLAIMARMOR_ENVIRONMENT:-development}
      CLAIMARMOR_REDIS_URL: redis://redis:6379/0
      CLAIMARMOR_CELERY_BROKER_URL: redis://redis:6379/0
    restart: unless-stopped

  # ── Flower (Celery monitoring UI) ─────────────────────────────────
  flower:
    image: claimarmor-app:local
    build:
      context: .
      args:
        APP_VERSION: "1.0.0"
    command: >
      python -m celery -A app.worker flower
      --port=5555
      --broker=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    environment:
      CLAIMARMOR_ENVIRONMENT: ${CLAIMARMOR_ENVIRONMENT:-development}
      CLAIMARMOR_REDIS_URL: redis://redis:6379/0
      CLAIMARMOR_CELERY_BROKER_URL: redis://redis:6379/0
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    depends_on: [prometheus]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-claimarmor}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
